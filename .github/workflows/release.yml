---
name: zejtron - Release

"on":
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: linux-amd64-gnu
            install_packages: ""
          - target: x86_64-unknown-linux-musl
            arch: linux-amd64-musl
            install_packages: musl-tools

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install system packages
        if: matrix.install_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install_packages }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install Rust target
        run: |
          rustup target add "${{ matrix.target }}"
          rustup target list --installed

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install codespell
        run: python3 -m pip install --user codespell

      - name: Run full checks
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: ./scripts/build.sh

      - name: Build
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package
        run: |
          set -Eeuo pipefail
          asset="zejtron-${TAG}-${{ matrix.arch }}"
          staging="$(mktemp -d)"
          mkdir -p "${staging}/${asset}"
          cp "target/${{ matrix.target }}/release/zejtron" \
            "${staging}/${asset}/zejtron"
          cp README.md LICENSE "${staging}/${asset}/"
          tar -C "${staging}/${asset}" \
            -czf "${asset}.tar.gz" zejtron README.md LICENSE

          # Checksums: SHA-512 (classical) + BLAKE2b-512 + SHAKE256 (quantum-resistant)
          sha512sum "${asset}.tar.gz" > "${asset}.tar.gz.sha512sum"
          b2sum "${asset}.tar.gz" > "${asset}.tar.gz.b2sum"
          # SHAKE256 via Python (cross-platform, consistent 64-byte output)
          python3 -c "
          import hashlib
          data = open('${asset}.tar.gz', 'rb').read()
          h = hashlib.shake_256(data).hexdigest(64)
          print(f'{h}  ${asset}.tar.gz')
          " > "${asset}.tar.gz.shake256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            zejtron-${{ env.TAG }}-${{ matrix.arch }}.tar.gz
            zejtron-${{ env.TAG }}-${{ matrix.arch }}.tar.gz.sha512sum
            zejtron-${{ env.TAG }}-${{ matrix.arch }}.tar.gz.b2sum
            zejtron-${{ env.TAG }}-${{ matrix.arch }}.tar.gz.shake256
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*

      - name: Collect artifacts for release
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' \
            -o -name '*.sha512sum' \
            -o -name '*.b2sum' \
            -o -name '*.shake256' \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Generate release body
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          {
            if [ -n "$PREV_TAG" ]; then
              echo "## What's Changed"
              echo ""
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${GITHUB_REF_NAME}"
              echo ""
            else
              echo "Initial release."
            fi
          } > release-body.md
          echo "=== Release body ==="
          cat release-body.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          prerelease: |-
            ${{ contains(github.ref_name, '-alpha.')
               || contains(github.ref_name, '-beta.')
               || contains(github.ref_name, '-rc.') }}
          files: release-assets/*

  aur-sync:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |-
      ${{ github.event_name == 'push'
          && github.ref_type == 'tag'
          && startsWith(github.ref_name, 'v')
          && !contains(github.ref_name, '-') }}

    steps:
      - name: Dispatch AUR sync
        uses: actions/github-script@v7
        with:
          script: |
            const eventType = 'aur-sync';
            const tag = context.ref.replace('refs/tags/', '');
            const isNormalSemver = /^v\d+\.\d+\.\d+$/.test(tag);

            core.info(`AUR dispatch tag: ${tag}`);
            core.info(`AUR dispatch normal semver vX.Y.Z: ${isNormalSemver}`);

            if (!isNormalSemver) {
              core.info(`Skipping AUR sync for non-normal tag ${tag}`);
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: eventType,
              client_payload: { tag },
            });
            core.info(`repository_dispatch sent: ${eventType}`);
